server:
  port: 8080

spring:
  datasource:
    # 루트 디렉토리의 .env 로부터 주입되는 환경변수를 바인딩합니다.
    url: ${DB_URL:jdbc:h2:mem:vibe;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # .env의 JWT_SCRET 키로 서명용 비밀키를 주입받습니다.
  secret: ${JWT_SCRET}
  expiration: 86400000 # 24시간 (밀리초 단위)

file:
  upload-dir: ${UPLOAD_BASE_DIR:D:/upload}
  paths:
    members: members
    boards: boards

