# Spring Boot backend port. React dev server calls this port.
server.port=8050

# JSP view resolver setting: return "notice/list" means /WEB-INF/views/notice/list.jsp.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

### Token
# Access Token valid time. Current value is 1 minute for class testing.
jwt.accessValidTime=60000
# Refresh Token valid time. Current value is 10 minutes for class testing.
jwt.refreshValidTime=600000
# JWT issuer value written inside the token. Kept as class spelling: issur.
jwt.issur=winter
# JWT signing secret key. HS256 needs a long enough string.
jwt.secretKey=adfua342fsfaa0fdsa23423423sdsfdf
